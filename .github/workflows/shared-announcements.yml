name: Refresh shared announcement feed

on:
  workflow_dispatch:
    inputs:
      force_feeds:
        description: 'Comma-separated online source IDs to refresh now (optional)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: patchlines-shared-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out public feed files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use the collector runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify the reviewed collector artifact
        working-directory: tools
        run: sha256sum --check shared-feed-collector.mjs.sha256
      - name: Collect public schedules and official announcements
        run: node --use-system-ca tools/shared-feed-collector.mjs
        env:
          PATCHLINE_DISCORD_BOT_TOKEN: ${{ secrets.PATCHLINE_DISCORD_BOT_TOKEN }}
          PATCHLINE_FORCE_FEEDS: ${{ inputs.force_feeds || '' }}
      - name: Commit only the public feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const expected='keo-reinz/patchline-downloads';
          if(process.env.GITHUB_REPOSITORY?.toLowerCase()!==expected)throw new Error('Unexpected public feed repository.');
          const files=await Promise.all(['data/announcements-v1.json','data/announcements-v2.json'].map(async(pathname,index)=>{
            const version=index+1,content=await readFile(pathname);
            if(content.length>8*1024*1024||JSON.parse(content).version!==version)throw new Error('Shared feed exceeds its public byte limit or has an invalid version.');
            return {pathname,content};
          }));
          const base=`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers={Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json','User-Agent':'Patchlines-Shared-Feed','X-GitHub-Api-Version':'2022-11-28'};
          const api=async(route,method='GET',body)=>{
            const response=await fetch(base+route,{method,headers,...(body?{body:JSON.stringify(body)}:{}),redirect:'error',signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw new Error(`Feed publication returned ${response.status}.`);
            return response.json();
          };
          const repository=await api(''),branch=repository.default_branch;
          const head=await api(`/git/ref/heads/${encodeURIComponent(branch)}`),commit=await api(`/git/commits/${head.object.sha}`);
          const tree=[];
          for(const {pathname,content} of files){const blob=await api('/git/blobs','POST',{content:content.toString('base64'),encoding:'base64'});tree.push({path:pathname,mode:'100644',type:'blob',sha:blob.sha});}
          const freshTree=await api('/git/trees','POST',{base_tree:commit.tree.sha,tree});
          const freshCommit=await api('/git/commits','POST',{message:'Refresh public announcement feeds',tree:freshTree.sha,parents:[head.object.sha]});
          await api(`/git/refs/heads/${encodeURIComponent(branch)}`,'PATCH',{sha:freshCommit.sha,force:false});
          console.log('Both public announcement feeds refreshed atomically.');
          JS
